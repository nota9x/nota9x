name: Update GitHub stats

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github-stats.svg"
      - "README.md"

  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=ffffff&text_color=8b949e&icon_color=ffffff
          path: assets/github-stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Commit updated stats
        run: |
          if git diff --quiet -- assets/github-stats.svg; then
            echo "Stats have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg
          git commit -m "chore(stats): update profile stats"

          git pull --rebase origin main
          git push
