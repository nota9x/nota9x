name: Update GitHub stats

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github-stats.svg"
      - "README.md"

  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=ffffff&text_color=8b949e&icon_color=ffffff
          path: assets/github-stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          fail_on_error: true

      - name: Bust README image cache
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()

          run_id = os.environ["GITHUB_RUN_ID"]

          text = re.sub(
              r'assets/github-stats\.svg\?v=[^"]+',
              f'assets/github-stats.svg?v={run_id}',
              text,
          )

          path.write_text(text)
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg README.md

          git diff --cached --quiet || git commit -m "chore(stats): update profile stats svg"
          git push
